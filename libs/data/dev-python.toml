[[app]]
id = "conda-pkgs"
name = "conda（包缓存 pkgs）"
category = "dev"
platforms = ["windows", "macos", "linux"]
official_doc = "https://docs.conda.io/projects/conda/en/latest/user-guide/configuration/custom-env-and-pkg-locations.html"
risk = "medium"
notes = "官方机制是 .condarc 的 pkgs_dirs，不是环境变量；改后需确认已有环境仍能解析包"
detect.env = ["CONDA_PKGS_DIRS"]
detect.windows = "%USERPROFILE%\\.conda\\pkgs"
detect.macos = "~/miniconda3/pkgs"
detect.linux = "~/miniconda3/pkgs"
redirect.method = "config_file"
redirect.config_path = "%USERPROFILE%\\.condarc"
redirect.config_key = "pkgs_dirs"
redirect.config_format = "yaml"

