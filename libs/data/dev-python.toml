# Python 生态的官方缓存重定向条目。
#
# 约定：redirect.method = "env_var" 的条目必须给出 official_doc，
# 加载器（catalog.py）会拒绝没有文档背书的条目，防止把猜测写进数据。

[[app]]
id = "pip"
name = "pip（下载缓存 / HTTP cache）"
category = "dev"
platforms = ["windows", "macos", "linux"]
official_doc = "https://pip.pypa.io/en/stable/topics/caching/"
risk = "low"
notes = "官方提供 --cache-dir 命令行参数、global.cache-dir 配置项与 PIP_CACHE_DIR 环境变量"
detect.env = ["PIP_CACHE_DIR"]
detect.windows = "%LOCALAPPDATA%\\pip\\Cache"
detect.macos = "~/Library/Caches/pip"
detect.linux = "~/.cache/pip"
redirect.method = "env_var"
redirect.env_name = "PIP_CACHE_DIR"
redirect.scope = "user"
redirect.value_template = "{target}\\pip"

[[app]]
id = "uv"
name = "uv（包与解释器缓存）"
category = "dev"
platforms = ["windows", "macos", "linux"]
official_doc = "https://docs.astral.sh/uv/reference/environment/"
risk = "low"
notes = "UV_CACHE_DIR 控制缓存；UV_PYTHON_INSTALL_DIR 控制解释器；UV_TOOL_DIR 控制 uv tool 安装目录"
processes = ["uv.exe", "uvx.exe"]
detect.env = ["UV_CACHE_DIR"]
detect.windows = "%LOCALAPPDATA%\\uv\\cache"
detect.macos = "~/Library/Caches/uv"
detect.linux = "~/.cache/uv"
redirect.method = "env_var"
redirect.env_name = "UV_CACHE_DIR"
redirect.scope = "user"
redirect.value_template = "{target}\\uv"

[[app]]
id = "uv-tools"
name = "uv tool 安装目录"
category = "dev"
platforms = ["windows", "macos", "linux"]
official_doc = "https://docs.astral.sh/uv/reference/environment/"
risk = "low"
notes = "uv tool install 的落点；与 UV_CACHE_DIR 分开设置"
detect.env = ["UV_TOOL_DIR"]
detect.windows = "%USERPROFILE%\\.local\\share\\uv\\tools"
detect.macos = "~/.local/share/uv/tools"
detect.linux = "~/.local/share/uv/tools"
redirect.method = "env_var"
redirect.env_name = "UV_TOOL_DIR"
redirect.scope = "user"
redirect.value_template = "{target}\\uv-tools"

[[app]]
id = "pipx"
name = "pipx（虚拟环境与 bin）"
category = "dev"
